version: '3'

vars:
  PYTHON_FILES: scripts tests

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install dependencies using uv
    cmds:
      - uv sync

  sync:
    desc: Sync dependencies using uv
    cmds:
      - uv sync

  # Testing & Coverage
  test:
    desc: Run tests with pytest
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test:coverage:
    desc: Run pytest with test coverage report
    cmds:
      - uv run pytest --cov=scripts --cov-report=term-missing {{.CLI_ARGS}}

  # Linting, Formatting & Spellchecking
  lint:
    desc: Lint Python code with ruff and check spelling with typos
    cmds:
      - task: lint:py
      - task: spellcheck

  lint:fix:
    desc: Fix linting and spelling issues automatically
    cmds:
      - task: lint:py:fix
      - task: spellcheck:fix

  lint:py:
    desc: Lint Python code with ruff
    cmds:
      - uv run ruff check {{.PYTHON_FILES}} {{.CLI_ARGS}}

  lint:py:fix:
    desc: Automatically fix ruff lint errors
    cmds:
      - uv run ruff check --fix {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:
    desc: Format Python code with ruff (2-space indent)
    cmds:
      - uv run ruff format {{.PYTHON_FILES}} {{.CLI_ARGS}}

  format:check:
    desc: Verify Python code formatting without modifying files
    cmds:
      - uv run ruff format --check {{.PYTHON_FILES}}

  spellcheck:
    desc: Check spelling with typos across the repository
    cmds:
      - typos {{.CLI_ARGS}}

  spellcheck:fix:
    desc: Automatically fix typos across the repository
    cmds:
      - typos --write-changes {{.CLI_ARGS}}

  spellcheck-file:
    desc: Check spelling with typos on a single file (FILE=path/to/file)
    cmds:
      - typos {{.FILE}}

  check:
    desc: Run lint (ruff + typos), format-check, test suite with coverage, and dataset validation
    cmds:
      - task: lint
      - task: format:check
      - task: test:coverage
      - task: validate

  # Data Pipeline
  scrape-gp:
    desc: Scrape Guitar Pro tabs (Priority 1)
    cmds:
      - uv run python scripts/scrape_gp.py {{.CLI_ARGS}}

  scrape-midi:
    desc: Scrape MIDI sequences (Priority 2)
    cmds:
      - uv run python scripts/scrape_midi.py {{.CLI_ARGS}}

  parse-gp:
    desc: Parse raw Guitar Pro files into processed JSON datasets
    cmds:
      - uv run python scripts/parse_gp.py {{.CLI_ARGS}}

  parse-midi:
    desc: Parse raw MIDI files into processed JSON datasets
    cmds:
      - uv run python scripts/parse_midi.py {{.CLI_ARGS}}

  build-artists:
    desc: Build artist metadata summaries matching schemas/artist_metadata.json
    cmds:
      - uv run python scripts/build_artist_metadata.py {{.CLI_ARGS}}

  ingest-tui:
    desc: Run batch ingestion pipeline with Catppuccin Mocha TUI reporter
    cmds:
      - uv run python scripts/runner.py {{.CLI_ARGS}}

  analyze:
    desc: Compute metric complexity metrics and Markovian transition matrices
    cmds:
      - uv run python scripts/analyze_structure.py {{.CLI_ARGS}}

  generate:
    desc: Generate novel prog metal meter progressions using learned sequence model
    cmds:
      - uv run python scripts/generate_progression.py {{.CLI_ARGS}}

  validate:
    desc: Validate processed datasets against JSON schemas and models
    cmds:
      - uv run pytest tests/test_models.py

[project]
name = "prog-metal-structures"
version = "0.1.0"
description = "Dataset mapping structural metadata, meter shifts, tempos, and sections in progressive metal tracks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "music21>=9.9.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.0",
    "pyguitarpro>=0.11",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
indent-width = 2
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "BLE001"]

[tool.ruff.format]
indent-style = "space"

[tool.coverage.run]
source = ["scripts"]
branch = true
omit = [
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

